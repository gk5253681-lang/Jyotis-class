name: Build Jyoti academy APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "Jyoti_academy_AI_Mock_Test_Source.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download original project
        uses: actions/checkout@v4

      - name: Extract native Android project
        shell: bash
        run: |
          unzip -q -o Jyoti_academy_AI_Mock_Test_Source.zip -d extracted
          test -f extracted/settings.gradle.kts
          test -f extracted/app/build.gradle.kts
          echo "Source ZIP extracted"

      - name: Apply guest sign-in and local progress fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib
          patch = zlib.decompress(base64.b64decode(Path('.github/patches/guest_fix.patch.b64').read_text().strip()))
          Path('extracted/guest_fix.patch').write_bytes(patch)
          PY
          cd extracted
          patch -p1 --dry-run < guest_fix.patch
          patch -p1 --batch < guest_fix.patch
          grep -F "continue_as_guest_button" app/src/main/java/com/example/ui/screens/auth/AuthScreen.kt
          grep -F "LOCAL_GUEST_USER_ID" app/src/main/java/com/example/ui/navigation/AppNavigation.kt
          sed -i 's/assertEquals("My Application", appName)/assertEquals("Jyoti academy", appName)/' app/src/test/java/com/example/ExampleRobolectricTest.kt
          grep -F 'assertEquals("Jyoti academy", appName)' app/src/test/java/com/example/ExampleRobolectricTest.kt

      - name: Apply AI generation and offline practice improvements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          encoded = ''.join(Path('.github/patches/question_fix.part' + str(i)).read_text().strip() for i in range(1, 5))
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '26dc8c89dd3cdc15c0ace9b42009eaa63ad030cbfb8b6085346fc19de47e0594', 'Patch integrity failed'
          Path('extracted/question_fix.patch').write_bytes(patch)
          PY
          mkdir -p extracted/app/src/main/assets
          cd extracted
          patch -p1 --dry-run < question_fix.patch
          patch -p1 --batch < question_fix.patch
          test -f app/src/main/assets/odia-cpet-original-v1.json.gz.b64
          test -f app/src/main/java/com/example/data/remote/PracticePackDownloader.kt
          # Make the packaged question data strict Base64 and verify it before shipping.
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, json
          asset = Path('app/src/main/assets/odia-cpet-original-v1.json.gz.b64')
          data = asset.read_text().split('--- a/app/src/')[0].strip()
          payload = gzip.decompress(base64.b64decode(data, validate=True))
          pack = json.loads(payload)
          assert pack['packId'] == 'jyoti-odia-cpet-original-v1'
          assert len(pack['questions']) == 60
          assert all(len(q['options']) == 4 and 0 <= q['correctIndex'] < 4 for q in pack['questions'])
          asset.write_text(data + '\n')
          print('Validated all 60 practice questions and fixed asset encoding')
          PY

      - name: Enable no-key automatic question preparation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          encoded=''.join(Path('.github/patches/no_key.part'+str(i)).read_text().strip() for i in (1,2,3))
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest() == '1ec9741063aeaab4bc8c8be9914ee08477ff076813f333109f79bca21ea54838'
          Path('extracted/no_key.patch').write_bytes(patch)
          PY
          cd extracted
          patch -p1 --dry-run < no_key.patch
          patch -p1 --batch < no_key.patch
          if grep -R -q "Your Gemini API key" app/src/main/java/com/example; then
            echo "User API-key field was not removed"
            exit 1
          fi
          grep -F "Start New Mock Test" app/src/main/java/com/example/ui/screens/home/HomeScreen.kt
          grep -F "offlineQuestions(config)" app/src/main/java/com/example/data/repository/MockTestRepository.kt

      - name: Handle slow AI requests without blocking mock tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('extracted/app/src/main/java/com/example/data/remote/GeminiOdiaQuestionService.kt')
          s=p.read_text()
          old='''                } catch (e: CancellationException) { throw e }'''
          new='''                } catch (e: TimeoutCancellationException) {
                    lastException = e
                } catch (e: CancellationException) { throw e }'''
          assert s.count(old) == 1
          p.write_text(s.replace(old,new))
          PY

      - name: Enable genuinely new online AI questions without a user API key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          data=Path('.github/patches/online_ai.patch.b64').read_text().strip()
          patch=gzip.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest() == '1e2a42f5f597863502ea5be3e8509a6ca82449e90ff5fa2b546f660dd4b25e12'
          Path('extracted/online_ai.patch').write_bytes(patch)
          PY
          cd extracted
          patch -p1 --dry-run < online_ai.patch
          patch -p1 --batch < online_ai.patch
          grep -F "https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions" app/src/main/java/com/example/data/remote/PublicOnlineOdiaQuestionService.kt
          grep -F "https://text.pollinations.ai/openai" app/src/main/java/com/example/data/remote/PublicOnlineOdiaQuestionService.kt
          grep -F "Could not generate online AI questions" app/src/main/java/com/example/data/repository/MockTestRepository.kt
          grep -F "Generate New AI Questions" app/src/main/java/com/example/ui/screens/home/HomeScreen.kt

      - name: Apply generation v2 progress and exact-count fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          payload=Path('.github/patches/generation_v2.patch.b64').read_text().strip()
          patch=gzip.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'aa68122dea8d7f6a05e035c241adbfe770f1a5a6627566c082620c55a3aac1a0'
          Path('extracted/generation_v2.patch').write_bytes(patch)
          PY
          cd extracted
          patch -p1 --dry-run < generation_v2.patch
          patch -p1 --batch < generation_v2.patch
          grep -F 'onCancelGeneration = viewModel::cancelGeneration' app/src/main/java/com/example/ui/navigation/AppNavigation.kt
          grep -F 'require(questions.size == config.questionCount)' app/src/main/java/com/example/data/repository/MockTestRepository.kt
          grep -F 'Generated $ready/$total' app/src/main/java/com/example/ui/screens/home/MainAppViewModel.kt

      - name: Apply reliable full-mock engine and expanded original practice bank
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          data=Path('.github/patches/reliability_v4.patch.b64').read_text().strip()
          patch=gzip.decompress(base64.b64decode(data, validate=True))
          expected='447103d7d7845d48fa0ced3c75814e1b916c571c8eb787a9e5ad30fd2251359b'
          assert hashlib.sha256(patch).hexdigest()==expected, 'Source patch integrity failed'
          Path('extracted/reliability_v4.patch').write_bytes(patch)
          PY
          cd extracted
          patch -p1 --dry-run < reliability_v4.patch
          patch -p1 --batch < reliability_v4.patch
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,json,collections
          asset=Path('app/src/main/assets/odia-cpet-original-v1.json.gz.b64').read_text().strip()
          pack=json.loads(gzip.decompress(base64.b64decode(asset, validate=True)))
          questions=pack['questions']
          assert len(questions)>=100, len(questions)
          assert len(set(q['stem'].strip().lower() for q in questions))==len(questions)
          counts=collections.Counter(q['topicKey'] for q in questions)
          assert len(counts)>=5 and all(n>=20 for n in counts.values()),counts
          assert all(len(q['options'])==4 and len(set(q['options']))==4 and 0<=q['correctIndex']<4 for q in questions)
          print('Structured practice pack verified:',len(questions),'questions across',len(counts),'topics')
          PY
          grep -F 'QuestionMixer.selectExact' app/src/main/java/com/example/data/repository/MockTestRepository.kt
          grep -F 'fun allRequestedCountsAreExact' app/src/test/java/com/example/QuestionMixerTest.kt

      - name: Enable strictly new online AI questions with repeat protection
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          encoded=''.join(Path('.github/patches/fresh_v5.part'+str(i)).read_text().strip() for i in range(1,5))
          assert len(encoded)==9060, len(encoded)
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='0f2aa76606142fafed8d5c5edc59389c1e7af26c1d119115c604398e5c7a4c8d'
          Path('extracted/fresh_v5.patch').write_bytes(patch)
          PY
          cd extracted
          # Apply independent hunks; the earlier v4 patch changed the surrounding context.
          patch -p1 --batch < fresh_v5.patch || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/example/data/repository/MockTestRepository.kt')
          s=p.read_text()
          at=s.index('    suspend fun generateMockSession(')
          start=s.rfind('    /**',0,at)
          assert start>0
          end=s.index('    /** Initialize all topic banks',at)
          replacement='''    /** Online tests strictly use unused AI-generated questions; offline practice is separate. */
              suspend fun generateMockSession(
                  config: TestConfig,
                  onProgress: (Int, Int, String) -> Unit = { _, _, _ -> }
              ): ActiveMockSession {
                  require(config.questionCount in 1..100)
                  val selected: List<Question>
                  val aiGeneratedCount: Int
                  if (config.sourceMode == QuestionSourceMode.GEMINI_AI) {
                      val fresh = FreshOnlineQuestionPool(requireNotNull(applicationContext)).prepare(
                          topic = config.topic,
                          difficulty = config.difficulty,
                          count = config.questionCount,
                          live = onlineAiService,
                          onProgress = onProgress
                      )
                      require(fresh.size == config.questionCount) {
                          "New AI supply incomplete: ${fresh.size}/${config.questionCount}"
                      }
                      cachedQuestionDao.insertAll(
                          fresh.map { CachedQuestionEntity.fromDomain(it, config.difficulty.name) }
                      )
                      selected = fresh
                      aiGeneratedCount = fresh.size
                  } else {
                      ensureBundledBank()
                      selected = offlineQuestions(config)
                      require(selected.size == config.questionCount)
                      aiGeneratedCount = 0
                  }
                  val finalQuestions = selected.shuffled().map(::shuffleAnswers)
                  return ActiveMockSession(
                      sessionId = UUID.randomUUID().toString(),
                      config = config,
                      questions = finalQuestions,
                      durationSeconds = finalQuestions.size * 60,
                      aiGeneratedCount = aiGeneratedCount
                  )
              }
          
          '''
          s=s[:start]+replacement+s[end:]
          if 'import com.example.data.remote.FreshOnlineQuestionPool' not in s:
              s=s.replace('import com.example.data.remote.PublicOnlineOdiaQuestionService',
              'import com.example.data.remote.PublicOnlineOdiaQuestionService\nimport com.example.data.remote.FreshOnlineQuestionPool')
          p.write_text(s)
          home=Path('app/src/main/java/com/example/ui/screens/home/HomeScreen.kt')
          h=home.read_text()
          h=h.replace('Online mode tries a small live AI batch and fills remaining questions from the original practice bank. If AI is rate-limited, you can still complete the mock test. The exam shows the AI versus bank count. No API key is needed.',
          'Online mode downloads unused AI questions and never substitutes old offline questions. It shows an error when the new-question supply is exhausted. No API key needed.')
          h=h.replace('Live AI: Pollinations or OVHcloud (anonymous and rate-limited). If unavailable, the app uses labelled original practice questions; it does not misrepresent them as newly AI-written. Offline mode uses saved questions only.',
          'New AI questions are periodically replenished online, with direct live AI as backup. Offline mode uses saved questions only.')
          home.write_text(h)
          PY
          test -f app/src/main/java/com/example/data/remote/FreshOnlineQuestionPool.kt
          test -f app/src/test/java/com/example/FreshOnlineQuestionPoolTest.kt
          grep -F 'FreshOnlineQuestionPool(requireNotNull(applicationContext)).prepare' app/src/main/java/com/example/data/repository/MockTestRepository.kt
          grep -F 'No old or repeated questions were substituted' app/src/main/java/com/example/data/remote/FreshOnlineQuestionPool.kt
          test -f app/src/test/java/com/example/FreshOnlineQuestionPoolTest.kt

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate SDK manager and install Android platform
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools missing from runner"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug signing key
        working-directory: extracted
        shell: bash
        run: |
          keytool -genkeypair -noprompt -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'

      - name: Compile debug APK
        working-directory: extracted
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jyoti-academy-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run local unit tests
        working-directory: extracted
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
