name: Build Jyoti academy APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "Jyoti_academy_AI_Mock_Test_Source.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract existing Android source ZIP
        run: |
          unzip -q -o Jyoti_academy_AI_Mock_Test_Source.zip -d extracted
          test -f extracted/settings.gradle.kts
          test -f extracted/app/build.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug signing key
        working-directory: extracted
        shell: bash
        run: |
          keytool -genkeypair -noprompt -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'

      - name: Run unit tests
        working-directory: extracted
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build APK
        working-directory: extracted
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jyoti-academy-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
